services:
  - type: web
    name: cs-faceit-checker
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MATCH_LIMIT
        value: "12"
      # Секреты Render спросит при создании сервиса, в репозиторий они не попадают.
      - key: STEAM_API_KEY
        sync: false
      - key: FACEIT_API_KEY
        sync: false
